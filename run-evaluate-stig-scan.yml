---
# Run Evaluate-STIG scan and upload results
- name: Run Evaluate-STIG scan and upload results
  hosts: all
  gather_facts: no

  vars:
    stig_workdir: "C:\\ProgramData\\Evaluate-STIG_1.2507.5\\Evaluate-STIG"
    stig_results: "C:\\Users\\Public\\Documents\\STIG_Compliance"

  tasks:
    - name: Ensure execution policy allows script execution
      ansible.windows.win_shell: |
        Set-ExecutionPolicy RemoteSigned -Scope LocalMachine -Force
        Set-ExecutionPolicy RemoteSigned -Scope CurrentUser -Force
      ignore_errors: yes

    - name: Run Evaluate-STIG scan
      ansible.windows.win_shell: |
        try {
            Write-Host "Running Evaluate-STIG scan..."
            Set-Location "{{ stig_workdir }}"
            powershell.exe -ExecutionPolicy Bypass -File .\Evaluate-STIG.ps1 -Output ckl
            Write-Host "✅ STIG scan completed successfully."
        } catch {
            Write-Host "❌ STIG scan failed: $($_.Exception.Message)"
            exit 1
        }

    - name: Copy STIG results back to network share
      ansible.windows.win_copy:
        src: "{{ stig_results }}"
        dest: "\\\\192.168.40.42\\raw-images\\stig-results\\{{ inventory_hostname }}"
        remote_src: yes
        recurse: yes
