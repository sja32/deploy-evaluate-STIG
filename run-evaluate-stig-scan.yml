---
# Playbook: run-evaluate-stig-scan.yml
# Purpose: Run Evaluate-STIG PowerShell scan on each Windows host
#          and copy results to Synology SMB share automatically.

- name: Run Evaluate-STIG scan and upload results
  hosts: windows
  gather_facts: no

  vars:
    stig_workdir: "C:\\ProgramData\\Evaluate-STIG_1.2507.5\\Evaluate-STIG"
    stig_results: "C:\\Users\\Public\\Documents\\STIG_Compliance"
    smb_share_root: "\\\\192.168.40.42\\raw-images"

    # Pull SMB credential values from AWX environment
    smb_user: "{{ lookup('env', 'SMB_SHARE_SYNOLOGY_NEW_USERNAME') }}"
    smb_pass: "{{ lookup('env', 'SMB_SHARE_SYNOLOGY_NEW_PASSWORD') }}"

  tasks:
    ###################################################################
    # 1️⃣ Ensure the Evaluate-STIG directory exists
    ###################################################################
    - name: Ensure Evaluate-STIG working directory exists
      ansible.windows.win_file:
        path: "{{ stig_workdir }}"
        state: directory

    ###################################################################
    # 2️⃣ Run Evaluate-STIG PowerShell scan
    ###################################################################
    - name: Run Evaluate-STIG scan
      ansible.windows.win_shell: |
        Write-Host "Running Evaluate-STIG scan..."
        if (-not (Test-Path "{{ stig_workdir }}\\Evaluate-STIG.ps1")) {
            throw "Evaluate-STIG.ps1 not found in {{ stig_workdir }}"
        }
        Set-Location "{{ stig_workdir }}"
        .\\Evaluate-STIG.ps1 -Output ckl
        Write-Host "✅ STIG scan completed successfully."
      register: stig_scan_result
      ignore_errors: no

    ###################################################################
    # 3️⃣ Ensure results directory exists locally
    ###################################################################
    - name: Ensure local STIG results directory exists
      ansible.windows.win_file:
        path: "{{ stig_results }}"
        state: directory

    ###################################################################
    # 4️⃣ Map Synology SMB share using AWX credentials
    ###################################################################
    - name: Map SMB share with provided credentials
      ansible.windows.win_shell: |
        $username = "{{ smb_user }}"
        $password = "{{ smb_pass }}"
        $secure = ConvertTo-SecureString $password -AsPlainText -Force
        $cred = New-Object System.Management.Automation.PSCredential ($username, $secure)
        if (Get-PSDrive Z -ErrorAction SilentlyContinue) { Remove-PSDrive -Name Z -Force }
        New-PSDrive -Name "Z" -PSProvider FileSystem -Root "{{ smb_share_root }}" -Credential $cred -ErrorAction Stop
      register: map_result
      changed_when: "'The command completed successfully' in map_result.stdout or map_result.rc == 0"

    ###################################################################
    # 5️⃣ Copy results to per-host folder on share
    ###################################################################
    - name: Copy STIG results to mapped share
      ansible.windows.win_shell: |
        $src = "{{ stig_results }}"
        $dest = "Z:\\stig-results\\{{ inventory_hostname }}"
        if (-not (Test-Path $dest)) {
            New-Item -Path $dest -ItemType Directory | Out-Null
        }
        Copy-Item -Path "$src\\*" -Destination $dest -Recurse -Force
        Write-Host "✅ Results copied successfully to $dest"
      register: copy_result
      ignore_errors: yes

    ###################################################################
    # 6️⃣ Always unmap the drive, even on failure
    ###################################################################
    - name: Cleanup mapped SMB drive
      ansible.windows.win_shell: |
        Remove-PSDrive -Name "Z" -Force -ErrorAction SilentlyContinue
      when: map_result is defined
      ignore_errors: yes

    ###################################################################
    # 7️⃣ Display completion summary
    ###################################################################
    - name: Display completion summary
      debug:
        msg:
          - "STIG scan completed on {{ inventory_hostname }}"
          - "{{ stig_scan_result.stdout | default('No output captured') }}"
          - "Results copied to \\\\192.168.40.42\\raw-images\\stig-results\\{{ inventory_hostname }}"
