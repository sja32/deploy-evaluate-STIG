---
# ===================================================================
# Role: deploy_evaluate_stig
# Purpose: Copy the entire Evaluate-STIG folder (not just its contents)
#          from a network share to C:\ProgramData using PowerShell.
# ===================================================================

- name: Ensure destination root (ProgramData) exists
  ansible.windows.win_file:
    path: "{{ dest_root }}"
    state: directory

- name: Copy full Evaluate-STIG folder from network share
  ansible.windows.win_shell: |
    $src = "{{ src_share }}"
    $destRoot = "{{ dest_root }}"
    $folderName = "Evaluate-STIG"
    $destPath = Join-Path $destRoot $folderName
    $user = "{{ smb_user }}"
    $pass = "{{ smb_pass }}"
    $log = "{{ copy_log }}"
    $timestamp = Get-Date -Format "yyyy-MM-dd HH:mm:ss"

    Add-Content $log "$timestamp - Starting full folder copy from $src to $destRoot"

    # Map the network share with credentials
    net use $src /user:$user $pass | Out-Null

    # Ensure destination folder structure exists
    if (-not (Test-Path $destPath)) {
        New-Item -Path $destPath -ItemType Directory | Out-Null
        Add-Content $log "$timestamp - Created destination folder: $destPath"
    }

    # Copy the entire Evaluate-STIG folder (not just contents)
    $sourceParent = Split-Path $src
    $folderToCopy = Split-Path $src -Leaf
    $copyTarget = $destRoot

    Add-Content $log "$timestamp - Copying folder $folderToCopy to $copyTarget"

    # Use Copy-Item to copy the folder itself, not only contents
    Copy-Item -Path (Join-Path $sourceParent $folderToCopy) `
              -Destination $copyTarget `
              -Recurse -Force -ErrorAction Stop

    Add-Content $log "$timestamp - Copy completed successfully."

    # Unmap the network share
    net use $src /delete | Out-Null

    Add-Content $log "$timestamp - Disconnected from $src"
  register: copy_result

- name: Display summary
  ansible.builtin.debug:
    msg:
      - "Evaluate-STIG folder copied successfully."
      - "Destination: {{ dest_root }}\\Evaluate-STIG"
      - "Log file: {{ copy_log }}"

# Optional: Verify that the copied folder exists
- name: Verify Evaluate-STIG folder presence
  ansible.windows.win_stat:
    path: "{{ dest_root }}\\Evaluate-STIG"
  register: stig_folder_check

- name: Show verification
  ansible.builtin.debug:
    msg: >-
      Folder exists: {{ stig_folder_check.stat.exists }},
      Size: {{ stig_folder_check.stat.size | default('unknown') }} bytes
