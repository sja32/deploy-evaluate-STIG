---
# ===================================================================
# Role: deploy_evaluate_stig
# Purpose: Copy the entire Evaluate-STIG folder (not just contents)
#          from a network share to C:\ProgramData using PowerShell.
#          Skips the copy if the folder already exists.
# ===================================================================

- name: Ensure destination root (ProgramData) exists
  ansible.windows.win_file:
    path: "{{ dest_root }}"
    state: directory

- name: Copy Evaluate-STIG folder from network share (idempotent)
  ansible.windows.win_shell: |
    $src = "{{ src_share }}"
    $destRoot = "{{ dest_root }}"
    $folderName = "Evaluate-STIG"
    $destPath = Join-Path $destRoot $folderName
    $user = "{{ smb_user }}"
    $pass = "{{ smb_pass }}"
    $log = "{{ copy_log }}"
    $timestamp = Get-Date -Format "yyyy-MM-dd HH:mm:ss"

    Add-Content $log "$timestamp - Starting Evaluate-STIG folder check."

    if (Test-Path $destPath) {
        $msg = "$timestamp - Evaluate-STIG already exists at $destPath. Skipping copy."
        Add-Content $log $msg
        Write-Output $msg
    }
    else {
        Add-Content $log "$timestamp - Folder not found. Beginning copy from $src to $destRoot."

        # Map the network share with credentials
        net use $src /user:$user $pass | Out-Null

        # Ensure destination root exists
        if (-not (Test-Path $destRoot)) {
            New-Item -Path $destRoot -ItemType Directory | Out-Null
            Add-Content $log "$timestamp - Created destination root: $destRoot"
        }

        # Copy the entire Evaluate-STIG folder
        $sourceParent = Split-Path $src
        $folderToCopy = Split-Path $src -Leaf
        $copyTarget = $destRoot

        Add-Content $log "$timestamp - Copying folder $folderToCopy to $copyTarget."
        Copy-Item -Path (Join-Path $sourceParent $folderToCopy) `
                  -Destination $copyTarget `
                  -Recurse -Force -ErrorAction Stop

        Add-Content $log "$timestamp - Copy completed successfully."

        # Unmap the network share
        net use $src /delete | Out-Null
        Add-Content $log "$timestamp - Disconnected from $src"
    }
  register: copy_result

- name: Display copy or skip summary
  ansible.builtin.debug:
    msg: "{{ copy_result.stdout_lines }}"
