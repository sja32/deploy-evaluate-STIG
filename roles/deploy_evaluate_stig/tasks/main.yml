---
# ===================================================================
# Role: deploy_evaluate_stig
# Purpose: Copy or update the Evaluate-STIG folder from network share
#          to C:\ProgramData using PowerShell with LastWriteTime,
#          file count, and total size comparison.
# ===================================================================

- name: Ensure destination root (ProgramData) exists
  ansible.windows.win_file:
    path: "{{ dest_root }}"
    state: directory

- name: Copy or update Evaluate-STIG folder (with detailed audit)
  ansible.windows.win_shell: |
    $src = '{{ src_share }}'
    $destRoot = '{{ dest_root }}'
    $folderName = 'Evaluate-STIG'
    $destPath = Join-Path $destRoot $folderName
    $user = '{{ smb_user }}'
    $pass = '{{ smb_pass }}'
    $log = '{{ copy_log }}'
    $timestamp = Get-Date -Format 'yyyy-MM-dd HH:mm:ss'

    Add-Content $log "$timestamp - Starting Evaluate-STIG folder verification."

    # Map the network share with credentials
    net use $src /user:$user $pass | Out-Null

    if (-not (Test-Path $src)) {
        Write-Output "$timestamp - ERROR: Source path not found at $src"
        Add-Content $log "$timestamp - ERROR: Source path not found at $src"
        exit 1
    }

    # Gather source stats
    $srcInfo = Get-Item $src
    $srcTime = $srcInfo.LastWriteTime
    $srcFiles = Get-ChildItem -Path $src -Recurse -Force | Measure-Object
    $srcSize = (Get-ChildItem -Path $src -Recurse -Force | Measure-Object -Property Length -Sum).Sum
    $srcSizeMB = [math]::Round($srcSize / 1MB, 2)

    # Gather destination stats (if present)
    if (Test-Path $destPath) {
        $destInfo = Get-Item $destPath
        $destTime = $destInfo.LastWriteTime
        $destFiles = Get-ChildItem -Path $destPath -Recurse -Force | Measure-Object
        $destSize = (Get-ChildItem -Path $destPath -Recurse -Force | Measure-Object -Property Length -Sum).Sum
        $destSizeMB = [math]::Round($destSize / 1MB, 2)
    } else {
        $destTime = Get-Date '1900-01-01'
        $destFiles = $null
        $destSizeMB = 0
    }

    Add-Content $log "$timestamp - Source: $($srcFiles.Count) files, $srcSizeMB MB, last modified $srcTime"
    Add-Content $log "$timestamp - Destination: $($destFiles.Count) files, $destSizeMB MB, last modified $destTime"

    # Decide whether to copy
    $action = 'skip'

    if (-not (Test-Path $destPath)) {
        $action = 'copy'
        Write-Output "$timestamp - Destination missing. Copying new version..."
    }
    elseif ($srcTime -gt $destTime -or $srcFiles.Count -ne $destFiles.Count -or ($srcSizeMB -ne $destSizeMB)) {
        $action = 'copy'
        Write-Output "$timestamp - Detected newer or mismatched source. Replacing destination..."
    }
    else {
        Write-Output "$timestamp - Evaluate-STIG is up-to-date. Skipping copy."
    }

    if ($action -eq 'copy') {
        if (Test-Path $destPath) {
            Remove-Item -Path $destPath -Recurse -Force
        }
        if (-not (Test-Path $destRoot)) {
            New-Item -Path $destRoot -ItemType Directory | Out-Null
        }

        $sourceParent = Split-Path $src
        $folderToCopy = Split-Path $src -Leaf
        $copyTarget = $destRoot

        Add-Content $log "$timestamp - Copying folder $folderToCopy to $copyTarget..."
        Copy-Item -Path (Join-Path $sourceParent $folderToCopy) `
                  -Destination $copyTarget `
                  -Recurse -Force -ErrorAction Stop

        $newCount = (Get-ChildItem -Path $destPath -Recurse -Force | Measure-Object).Count
        $newSize = [math]::Round(((Get-ChildItem -Path $destPath -Recurse -Force | Measure-Object -Property Length -Sum).Sum / 1MB), 2)

        Add-Content $log "$timestamp - Copy completed successfully. Destination now has $newCount files ($newSize MB)."
        Write-Output "$timestamp - Copy completed successfully. Destination now has $newCount files ($newSize MB)."
    }

    # Disconnect from share
    net use $src /delete | Out-Null
    Add-Content $log "$timestamp - Disconnected from $src"
  register: copy_result

- name: Display copy or skip summary
  ansible.builtin.debug:
    var: copy_result.stdout_lines
