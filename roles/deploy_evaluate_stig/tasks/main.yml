---
- name: Ensure destination root exists
  ansible.windows.win_file:
    path: "{{ dest_root }}"
    state: directory

- name: Copy Evaluate-STIG folder from network share
  ansible.windows.win_shell: |
    $src = "\\192.168.40.42\raw-images\Evaluate-STIG"
    $dest = "{{ dest_root }}"
    $user = "{{ smb_user }}"
    $pass = "{{ smb_pass }}"
    $log = "{{ copy_log }}"

    $timestamp = Get-Date -Format "yyyy-MM-dd HH:mm:ss"
    Add-Content $log "$timestamp Starting copy from $src to $dest"

    net use $src /user:$user $pass
    robocopy $src $dest /E /Z /R:3 /W:5 /LOG+:$log
    net use $src /delete

    Add-Content $log "$timestamp Copy completed successfully."
  register: copy_result

- name: Debug copy summary
  ansible.builtin.debug:
    msg: "Evaluate-STIG copied successfully to {{ dest_root }}. Log saved at: {{ copy_log }}"
