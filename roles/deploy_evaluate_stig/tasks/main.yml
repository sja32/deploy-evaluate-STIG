---
- name: Ensure destination root exists
  ansible.windows.win_file:
    path: "{{ dest_root }}"
    state: directory

- name: Add temporary SMB credentials (if provided)
  ansible.windows.win_command: >
    cmdkey /add:192.168.40.42 /user:{{ smb_user }} /pass:{{ smb_pass }}
  when: smb_user | default('') | length > 0
  changed_when: false

- name: Copy Evaluate-STIG folder using PowerShell Copy-Item
  ansible.windows.win_shell: |
    $src = "{{ src_share }}"
    $dest = "{{ dest_path }}"
    $log = "{{ copy_log }}"
    $timestamp = Get-Date -Format "yyyy-MM-dd HH:mm:ss"
    Add-Content $log "[$timestamp] Starting copy from $src to $dest"
    Copy-Item -Path $src -Destination $dest -Recurse -Force -ErrorAction Stop
    Add-Content $log "[$timestamp] Copy completed successfully."
  register: copy_result

- name: Debug copy result (log path)
  ansible.builtin.debug:
    msg: "Evaluate-STIG copied successfully. Log saved at: {{ copy_log }}"

- name: Remove temporary SMB credentials
  ansible.windows.win_command: cmdkey /delete:192.168.40.42
  when: smb_user | default('') | length > 0
  changed_when: false
