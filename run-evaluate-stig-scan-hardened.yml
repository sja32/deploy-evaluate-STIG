---
# Playbook: run-evaluate-stig-scan.yml (Hardened Edition)
# Purpose: Run Evaluate-STIG scan, log activity, copy results only if new,
#          and optionally purge aged-out results from the share.

- name: Run Evaluate-STIG scan and upload results
  hosts: all
  gather_facts: no

  vars:
    stig_workdir: "C:\\ProgramData\\Evaluate-STIG_1.2507.5\\Evaluate-STIG"
    stig_results: "C:\\Users\\Public\\Documents\\STIG_Compliance"
    log_dir: "C:\\ProgramData\\Evaluate-STIG_Logs"
    smb_share_root: "\\\\192.168.40.42\\raw-images"
    smb_user: "{{ lookup('env', 'SMB_SHARE_SYNOLOGY_NEW_USERNAME') }}"
    smb_pass: "{{ lookup('env', 'SMB_SHARE_SYNOLOGY_NEW_PASSWORD') }}"
    purge_old_results: false   # Set to true to enable cleanup
    purge_age_days: 30         # Age threshold for auto-purge

  tasks:
    ###################################################################
    # 1️⃣ Ensure local log folder exists
    ###################################################################
    - name: Ensure local log directory exists
      ansible.windows.win_file:
        path: "{{ log_dir }}"
        state: directory

    - name: Log start of STIG scan
      ansible.windows.win_shell: |
        Add-Content -Path "{{ log_dir }}\\scan.log" -Value "[$(Get-Date)] Starting STIG scan on {{ inventory_hostname }}..."
      changed_when: false

    ###################################################################
    # 2️⃣ Ensure Evaluate-STIG working directory exists
    ###################################################################
    - name: Ensure Evaluate-STIG working directory exists
      ansible.windows.win_file:
        path: "{{ stig_workdir }}"
        state: directory

    ###################################################################
    # 3️⃣ Run Evaluate-STIG scan
    ###################################################################
    - name: Run Evaluate-STIG scan
      ansible.windows.win_shell: |
        Write-Host "Running Evaluate-STIG scan..."
        if (-not (Test-Path "{{ stig_workdir }}\\Evaluate-STIG.ps1")) {
            throw "Evaluate-STIG.ps1 not found in {{ stig_workdir }}"
        }
        Set-Location "{{ stig_workdir }}"
        .\\Evaluate-STIG.ps1 -Output ckl
        Write-Host "✅ STIG scan completed successfully."
        Add-Content -Path "{{ log_dir }}\\scan.log" -Value "[$(Get-Date)] STIG scan completed successfully on {{ inventory_hostname }}."
      register: stig_scan_result

    ###################################################################
    # 4️⃣ Smart copy results to Synology share
    ###################################################################
    - name: Copy only new STIG results to Synology share
      ansible.windows.win_shell: |
        $username = "{{ smb_user }}"
        $password = "{{ smb_pass }}"
        $secure = ConvertTo-SecureString $password -AsPlainText -Force
        $cred = New-Object System.Management.Automation.PSCredential ($username, $secure)

        $src = "{{ stig_results }}"
        $dest = "{{ smb_share_root }}\\stig-results\\{{ inventory_hostname }}"

        New-PSDrive -Name "Z" -PSProvider FileSystem -Root "{{ smb_share_root }}" -Credential $cred -ErrorAction Stop | Out-Null

        if (-not (Test-Path "Z:\\stig-results")) {
            New-Item -Path "Z:\\stig-results" -ItemType Directory | Out-Null
        }
        if (-not (Test-Path "Z:\\stig-results\\{{ inventory_hostname }}")) {
            New-Item -Path "Z:\\stig-results\\{{ inventory_hostname }}" -ItemType Directory | Out-Null
        }

        $recent = Get-ChildItem -Path $src -Recurse | Where-Object { $_.LastWriteTime -gt (Get-Date).AddMinutes(-10) }
        if ($recent) {
            Write-Host "Copying new results from $src to $dest..."
            Copy-Item -Path "$src\\*" -Destination "Z:\\stig-results\\{{ inventory_hostname }}" -Recurse -Force
            Add-Content -Path "{{ log_dir }}\\scan.log" -Value "[$(Get-Date)] Results copied successfully to $dest."
        }
        else {
            Write-Host "No new results to copy."
            Add-Content -Path "{{ log_dir }}\\scan.log" -Value "[$(Get-Date)] No new results to copy for {{ inventory_hostname }}."
        }

        Remove-PSDrive -Name "Z" -Force -ErrorAction SilentlyContinue
      register: copy_result
      ignore_errors: no

    ###################################################################
    # 5️⃣ Optional: Purge aged-out STIG results on the share
    ###################################################################
    - name: Purge old STIG results from Synology share
      ansible.windows.win_shell: |
        $limit = (Get-Date).AddDays(-{{ purge_age_days }})
        $path = "\\\\192.168.40.42\\raw-images\\stig-results"
        Write-Host "Purging results older than {{ purge_age_days }} days in $path..."
        Get-ChildItem $path | Where-Object { $_.LastWriteTime -lt $limit } | Remove-Item -Recurse -Force
        Add-Content -Path "{{ log_dir }}\\scan.log" -Value "[$(Get-Date)] Purged old results older than {{ purge_age_days }} days from $path."
      when: purge_old_results | bool

    ###################################################################
    # 6️⃣ Display final summary
    ###################################################################
    - name: Display completion summary
      debug:
        msg:
          - "✅ STIG scan completed on {{ inventory_hostname }}"
          - "{{ stig_scan_result.stdout | default('No scan output captured') }}"
          - "Results folder: \\\\192.168.40.42\\raw-images\\stig-results\\{{ inventory_hostname }}"
          - "Local log: {{ log_dir }}\\scan.log"
