---
# Playbook: deploy-evaluate-stig.yml
# Purpose: Deploy the latest Evaluate-STIG package from a network share to Windows endpoints

- name: Deploy Evaluate-STIG package
  hosts: all
  gather_facts: no
  vars:
    stig_src: '\\192.168.40.42\raw-images\Evaluate-STIG_1.2507.5'
    stig_dest: 'C:\ProgramData\Evaluate-STIG_1.2507.5'

  tasks:
    - name: Ensure destination directory exists
      ansible.windows.win_file:
        path: "{{ stig_dest }}"
        state: directory

    - name: Map, copy, and unmap using PowerShell only
      ansible.windows.win_shell: |
        try {
            Write-Host "Mapping network share..."
            net use Z: "{{ stig_src }}" /user:"{{ smb_user }}" "{{ smb_pass }}" | Out-Null

            Write-Host "Copying files to {{ stig_dest }}..."
            Copy-Item -Path "Z:\*" -Destination "{{ stig_dest }}" -Recurse -Force -ErrorAction Stop

            Write-Host "Cleaning up mapped drive..."
            net use Z: /delete /y | Out-Null

            Write-Host "✅ Evaluate-STIG deployment complete."
        }
        catch {
            Write-Host "❌ Deployment failed: $($_.Exception.Message)"
            net use Z: /delete /y | Out-Null
            exit 1
        }
      register: ps_result
      ignore_errors: no

    - name: Show PowerShell output
      debug:
        var: ps_result.stdout_lines
