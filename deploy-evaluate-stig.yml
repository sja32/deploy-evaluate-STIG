---
# Playbook: deploy-evaluate-stig.yml
# Purpose: Deploy the latest Evaluate-STIG package from a network share to Windows endpoints

- name: Deploy Evaluate-STIG package
  hosts: all
  gather_facts: no
  vars:
    stig_src: '\\192.168.40.42\raw-images\Evaluate-STIG_1.2507.5'
    stig_dest: 'C:\ProgramData\Evaluate-STIG'

  tasks:
    - name: Ensure destination directory exists
      ansible.windows.win_file:
        path: "{{ stig_dest }}"
        state: directory

    - name: Map network share temporarily
      ansible.windows.win_command: >
        net use Z: {{ stig_src }} /user:"{{ smb_user }}" "{{ smb_pass }}"
      args:
        executable: cmd.exe
      register: map_result
      ignore_errors: yes

    - name: Debug share mapping
      debug:
        var: map_result.stdout_lines

    - name: Copy Evaluate-STIG files to destination
      ansible.windows.win_copy:
        src: Z:\
        dest: "{{ stig_dest }}"
        remote_src: yes
        recurse: yes
      ignore_errors: yes

    - name: Remove mapped drive (cleanup)
      ansible.windows.win_command: >
        net use Z: /delete /y
      args:
        executable: cmd.exe
      ignore_errors: yes
